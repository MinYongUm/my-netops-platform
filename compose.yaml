name: netops

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?missing in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing in .env}
      POSTGRES_DB: ${POSTGRES_DB:?missing in .env}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.0.31
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_SERVER_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:?missing in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing in .env}
      POSTGRES_DB: ${POSTGRES_DB:?missing in .env}

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0.31
    depends_on:
      db:
        condition: service_healthy
      zabbix-server:
        condition: service_started
    environment:
      DB_SERVER_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:?missing in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing in .env}
      POSTGRES_DB: ${POSTGRES_DB:?missing in .env}
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: ${TZ:?missing in .env}
    ports:
      - "${ZBX_WEB_PORT:?missing in .env}:8080"

  grafana:
    image: grafana/grafana:13.2.4
    depends_on:
      zabbix-web:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?missing in .env}
      GF_PLUGINS_PREINSTALL_SYNC: alexanderzobnin-zabbix-app@6.9.1
      TZ: ${TZ:?missing in .env}
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:?missing in .env}:3000"

volumes:
  pg-data:
  grafana-data:
