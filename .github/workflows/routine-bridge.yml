# routine-bridge — AI 리뷰 결과를 Claude Code Routine API trigger 로 넘기는 브리지 (Issue #11 Phase 1-C)
#
# 기본 꺼짐(OFF). 현재 이 파일로는 Claude Routine API 를 호출할 수 없다:
#   - 저장소 변수 ROUTINE_BRIDGE_ENABLED 가 'true' 가 아니면 job 이 skipped (코드 실행·외부 호출 0회)
#   - 변수를 켜도 Routine 토큰 Secret 을 이 파일에서 연결하지 않으므로 결과는 disabled (exit 3, 빨간색)
#   - 토큰 연결(secrets 참조 추가)은 사용자 승인 후 별도 PR 에서만
# - 수동 실행(workflow_dispatch)만, 저장소 소유자만, main 의 워크플로만
# - PR head 를 checkout 하지 않는다 (신뢰된 main 의 스크립트만 실행). 권한은 읽기 전용
# - 설계·활성화·중단 절차: docs/ROUTINE-BRIDGE.md
name: routine-bridge
# 전달 기록(중복·PR당 상한)을 이 run-name 으로 찾는다. 형식을 바꾸면 scripts/automation/routine_bridge.py 도 같이 바꾼다
run-name: routine-bridge pr=${{ inputs.pr_number }} head=${{ inputs.head_sha }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "리뷰한 PR 번호"
        required: true
        type: string
      head_sha:
        description: "리뷰한 정확한 head SHA (40자리 소문자 hex)"
        required: true
        type: string
      review_url:
        description: "AI 리뷰 코멘트 URL (https://github.com/OWNER/REPO/pull/N#issuecomment-ID)"
        required: true
        type: string

permissions: {}

concurrency:
  # 같은 PR 은 한 번에 하나만. 진행 중인 실행은 취소하지 않는다
  group: routine-bridge-pr-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  forward:
    name: forward
    if: >-
      vars.ROUTINE_BRIDGE_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # 신뢰된 main checkout
      pull-requests: read # PR 상태·head 재조회
      issues: read # 리뷰 코멘트 재조회
      checks: read # CI 결과 재조회
      actions: read # 이 워크플로의 과거 전달 기록 조회
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Forward review result (OFF unless approved)
        env:
          # 입력값은 env 로만 넘긴다 (스크립트에 직접 끼워 넣지 않음 → 명령 주입 방지)
          ROUTINE_BRIDGE_ENABLED: ${{ vars.ROUTINE_BRIDGE_ENABLED }}
          ROUTINE_BRIDGE_MAX_ROUNDS: ${{ vars.ROUTINE_BRIDGE_MAX_ROUNDS }}
          GITHUB_TOKEN: ${{ github.token }}
          BRIDGE_PR_NUMBER: ${{ inputs.pr_number }}
          BRIDGE_HEAD_SHA: ${{ inputs.head_sha }}
          BRIDGE_REVIEW_URL: ${{ inputs.review_url }}
          # CLAUDE_ROUTINE_TOKEN, CLAUDE_ROUTINE_TRIGGER_ID 는 연결하지 않는다 (사용자 승인 후 별도 PR)
        run: python3 -I -B scripts/automation/routine_bridge.py
