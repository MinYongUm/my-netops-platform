# ai-review — CI 가 성공한 PR 을 AI 로 리뷰하고, 코멘트를 남기고, needs_changes 면 Claude Routine 에 넘긴다
# (Issue #9 Phase 2, #5 Phase 2-C·2-D). 기본 꺼짐(OFF)
#
# 시범 운영: 테스트 PR #10 만. PR 당 모델 호출 1회·코멘트 1개·Claude 트리거 1회 (scripts/automation/review_pipeline.py 에 고정)
#
# 실제로 동작하려면 사용자가 아래를 직접 설정해야 한다 (설정하지 않으면 각 단계는 skipped·disabled):
#   변수  AI_REVIEW_ENABLED=true, AI_REVIEW_MODEL, AI_REVIEW_PUBLISH=true, ROUTINE_BRIDGE_ENABLED=true
#   Secret OPENAI_API_KEY, CLAUDE_ROUTINE_TOKEN, CLAUDE_ROUTINE_TRIGGER_ID
#
# 권한 분리 (job 마다 최소 권한, Secret 은 쓰는 step 에만):
#   review   읽기 전용 + OPENAI_API_KEY (Model review step 에만). 쓰기 권한 없음
#   publish  pull-requests: write. 모델 키·Routine 토큰 없음
#   forward  읽기 전용 + CLAUDE_ROUTINE_TOKEN·TRIGGER_ID (Forward step 에만). 쓰기 권한 없음
# - 진입점: 신뢰된 main 의 이 파일이 CI 완료(workflow_run)에 반응한다. workflow_run 은 기본 브랜치의
#   워크플로 파일로만 실행되므로 PR 이 이 파일을 바꿔도 그 PR 의 리뷰 동작은 바뀌지 않는다
# - PR head 를 checkout·실행하지 않는다 (checkout 은 workflow_run 기본값 = 기본 브랜치 최신 커밋)
# - job 사이 값(job output)은 다음 단계가 GitHub API 로 다시 검증한다. 값은 env 로만 넘긴다 (명령 주입 방지)
# - 설계·상태·사용자 조치: docs/AUTOMATION.md
name: ai-review
# 호출 기록(PR당 상한·같은 SHA 중복)을 이 run-name 과 step 이름으로 센다.
# 형식·이름을 바꾸면 scripts/automation/review_pipeline.py 의 RUN_NAME_RE·*_STEP 도 같이 바꾼다
run-name: ai-review pr=${{ github.event.workflow_run.pull_requests[0].number }} head=${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

concurrency:
  # 같은 PR 브랜치는 한 번에 하나만. 새 push 로 시작된 실행이 오래된 실행을 취소한다 (오래된 SHA 리뷰 방지)
  group: ai-review-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  review:
    name: review
    # 하나라도 아니면 job 이 skipped 로 끝난다 (리뷰 성공으로 표시되지 않음). 스크립트도 같은 조건을 다시 검사한다
    if: >-
      vars.AI_REVIEW_ENABLED == 'true' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.status == 'completed' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number == 10
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # 신뢰된 main checkout
      pull-requests: read # PR 확정·재조회, 변경 파일
      issues: read # 연결 Issue, 기존 리뷰 코멘트(중복·상한) 조회
      actions: read # CI run·워크플로 재조회, 이 워크플로의 호출 기록 조회
    outputs:
      result_b64: ${{ steps.model.outputs.result_b64 }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare (gates, no model key)
        id: prepare
        env:
          AI_REVIEW_ENABLED: ${{ vars.AI_REVIEW_ENABLED }}
          GITHUB_TOKEN: ${{ github.token }}
          AI_REVIEW_HANDOFF: ${{ runner.temp }}/ai-review-input.json
        run: python3 -I -B scripts/automation/review_pipeline.py prepare

      - name: Model review
        id: model
        if: steps.prepare.outputs.ready == 'true'
        env:
          AI_REVIEW_ENABLED: ${{ vars.AI_REVIEW_ENABLED }}
          AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL }}
          AI_REVIEW_MAX_OUTPUT_TOKENS: ${{ vars.AI_REVIEW_MAX_OUTPUT_TOKENS }}
          AI_REVIEW_TIMEOUT_SECONDS: ${{ vars.AI_REVIEW_TIMEOUT_SECONDS }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          AI_REVIEW_HANDOFF: ${{ runner.temp }}/ai-review-input.json
        run: python3 -I -B scripts/automation/review_pipeline.py review

  publish:
    name: publish
    needs: review
    # 리뷰어 실패(result=failed)도 코멘트로 남기기 위해 review job 이 실패해도 결과가 있으면 실행한다
    if: >-
      !cancelled() &&
      needs.review.outputs.result_b64 != '' &&
      vars.AI_REVIEW_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # 신뢰된 main checkout
      pull-requests: write # 리뷰 코멘트 1개 게시 (이 job 만 쓰기 권한)
      issues: read # 기존 리뷰 코멘트(중복·상한) 조회
      checks: read # 그 SHA 의 static-checks 결과 재확인
      actions: read # CI run·워크플로·이 워크플로의 게시 기록 재조회
    outputs:
      comment_url: ${{ steps.post.outputs.comment_url }}
      outcome: ${{ steps.post.outputs.outcome }}
      pr_number: ${{ steps.post.outputs.pr_number }}
      head_sha: ${{ steps.post.outputs.head_sha }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publish review comment
        id: post
        env:
          AI_REVIEW_ENABLED: ${{ vars.AI_REVIEW_ENABLED }}
          AI_REVIEW_PUBLISH: ${{ vars.AI_REVIEW_PUBLISH }}
          AI_REVIEW_RESULT_B64: ${{ needs.review.outputs.result_b64 }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I -B scripts/automation/review_pipeline.py publish

  forward:
    name: forward
    needs: publish
    if: >-
      !cancelled() &&
      needs.publish.outputs.outcome == 'needs_changes' &&
      needs.publish.outputs.comment_url != '' &&
      vars.ROUTINE_BRIDGE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # 신뢰된 main checkout
      pull-requests: read # PR 재조회
      issues: read # 리뷰 코멘트 재조회
      checks: read # CI 결과 재조회
      actions: read # 전달 기록 조회
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Forward to Claude Routine
        env:
          AI_REVIEW_ENABLED: ${{ vars.AI_REVIEW_ENABLED }}
          ROUTINE_BRIDGE_ENABLED: ${{ vars.ROUTINE_BRIDGE_ENABLED }}
          CLAUDE_ROUTINE_TOKEN: ${{ secrets.CLAUDE_ROUTINE_TOKEN }}
          CLAUDE_ROUTINE_TRIGGER_ID: ${{ secrets.CLAUDE_ROUTINE_TRIGGER_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          BRIDGE_PR_NUMBER: ${{ needs.publish.outputs.pr_number }}
          BRIDGE_HEAD_SHA: ${{ needs.publish.outputs.head_sha }}
          BRIDGE_REVIEW_URL: ${{ needs.publish.outputs.comment_url }}
        run: python3 -I -B scripts/automation/review_pipeline.py forward
