# ai-review — CI 가 성공한 PR 을 AI 로 리뷰하는 워크플로 (Issue #9 Phase 2). 기본 꺼짐(OFF)
#
# 현재 이 파일로는 AI 리뷰도, PR 코멘트도 할 수 없다:
#   - 저장소 변수 AI_REVIEW_ENABLED 가 'true' 가 아니면 job 이 skipped (코드 실행·외부 호출 0회. 성공 아님)
#   - 변수를 켜도 OPENAI_API_KEY Secret 을 연결하지 않고, 스크립트에 실제 리뷰어가 없으므로 결과는
#     disabled (exit 3, 빨간색). 모델 호출·코멘트 게시 코드는 없다
#   - Secret 연결·실제 리뷰어·코멘트 게시(pull-requests: write, 별도 job)는 사용자 승인 후 별도 PR 에서만
# - 진입점: 신뢰된 main 의 이 파일이 CI 완료(workflow_run)에 반응한다. workflow_run 은 기본 브랜치의
#   워크플로 파일로만 실행되므로 PR 이 이 파일을 바꿔도 그 PR 의 리뷰 동작은 바뀌지 않는다
# - PR head 를 checkout·실행하지 않는다 (checkout 은 workflow_run 기본값 = 기본 브랜치 최신 커밋). 권한은 읽기 전용
# - 설계·상태·활성화 전 승인 항목: docs/AUTOMATION.md
name: ai-review

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

concurrency:
  # 같은 PR 브랜치는 한 번에 하나만. 새 push 로 시작된 실행이 오래된 실행을 취소한다 (오래된 SHA 리뷰 방지)
  group: ai-review-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  review:
    name: review
    # 하나라도 아니면 job 이 skipped 로 끝난다 (리뷰 성공으로 표시되지 않음). 스크립트도 같은 조건을 다시 검사한다
    if: >-
      vars.AI_REVIEW_ENABLED == 'true' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.status == 'completed' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # 신뢰된 main checkout
      pull-requests: read # PR 확정·재조회, 변경 파일
      issues: read # 기존 리뷰 코멘트(중복·상한) 조회
      actions: read # CI run 재조회
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: AI review (OFF unless approved; no model call in this version)
        env:
          # 값은 env 로만 넘긴다 (스크립트에 직접 끼워 넣지 않음 → 명령 주입 방지)
          AI_REVIEW_ENABLED: ${{ vars.AI_REVIEW_ENABLED }}
          AI_REVIEW_MAX_ROUNDS: ${{ vars.AI_REVIEW_MAX_ROUNDS }}
          GITHUB_TOKEN: ${{ github.token }}
          # OPENAI_API_KEY 는 연결하지 않는다 (사용자 승인 후 별도 PR)
        run: python3 -I -B scripts/automation/ai_review.py
